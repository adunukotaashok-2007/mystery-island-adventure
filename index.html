<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Mystery Island - Family Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <canvas id="canvas"></canvas>

        <div id="topBar">
            <div id="title">🏝️ Mystery Island</div>
            <div id="treasure">💎 Treasures: 0</div>
        </div>

        <div id="message">
            Explore the island and find the hidden treasure!
        </div>

        <div id="controls">
            <div class="controlButton" id="up">▲</div>

            <div class="middleControls">
                <div class="controlButton" id="left">◀</div>
                <div class="controlButton" id="down">▼</div>
                <div class="controlButton" id="right">▶</div>
            </div>
        </div>

    </div>

    <script src="game.js"></script>

</body>

  </html>
